[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmfinder-recommendation-engine"
version = "0.1.0"
description = "FilmFinder M5 + KNN recommendation engine"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]
